# Set update schedule for GitHub Actions, Node-RED packages and Docker image
# Dependabot opens a pull request for each available update

version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      # Check for updates to Node-RED packages (package.json) every week
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      # Check for updates to Node-RED base image (Dockerfile) every week
      interval: "weekly"
