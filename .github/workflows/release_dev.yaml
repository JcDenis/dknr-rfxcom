name: Build and push docker dev image

on:
  schedule:
  - cron: '30 5 * * *'
  workflow_dispatch:

env:
  DKNR_NAMESPACE: jcpd
  DKNR_IMAGE: dknr-rfxcom

jobs:
  do_image:
    name: Build and push docker dev image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to Github registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set lower case github repository
        run: |
          echo "GITHUB_REPOSITORY=${REPO,,}" >>${GITHUB_ENV}
        env:
          REPO: '${{ github.repository }}'

      - name: Build and push images
        uses: docker/build-push-action@v7
        with:
          context: .
          sbom: true
          push: true
          tags: |
            ${{ env.DKNR_NAMESPACE }}/${{ env.DKNR_IMAGE }}:dev
            ghcr.io/${{ env.GITHUB_REPOSITORY }}:dev
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          no-cache: true

      - name: Docker Scout stable
        id: docker-scout
        uses: docker/scout-action@v1.27.0
        with:
          command: environment,quickview,cves
          image: ${{ env.DKNR_NAMESPACE }}/${{ env.DKNR_IMAGE }}:dev
          environment: unstable
          organization: ${{ env.DKNR_NAMESPACE }}
          write-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

