name: Build and push docker image release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        type: string
        required: true

env:
  DKNR_NAMESPACE: jcpd
  DKNR_IMAGE: dknr-rfxcom

jobs:
  do_image:
    name: Build and push docker image release
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Create repository branch
        id: create
        uses: peterjgrainger/action-create-branch@v4.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          branch: ${{ github.event.inputs.version }}

      - name: notcreated
        if: (steps.create.outputs.created != 'true')
        run: |
          SUMMARY=$'Branch ${{ github.event.inputs.version }} has not been created.'
          echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY

      - name: created
        if: (steps.create.outputs.created == 'true')
        run: |
          SUMMARY=$' Branch ${{ github.event.inputs.version }} has been created.'
          echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY

      - name: Create tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ github.event.inputs.version }}

      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.version }}
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to Github registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set lower case github repository
        run: |
          echo "GITHUB_REPOSITORY=${REPO,,}" >>${GITHUB_ENV}
        env:
          REPO: '${{ github.repository }}'

      - name: Build and push images
        uses: docker/build-push-action@v7
        with:
          context: .
          sbom: true
          push: true
          tags: |
            ${{ env.DKNR_NAMESPACE }}/${{ env.DKNR_IMAGE }}:${{ github.event.inputs.version }}
            ${{ env.DKNR_NAMESPACE }}/${{ env.DKNR_IMAGE }}:latest
            ghcr.io/${{ env.GITHUB_REPOSITORY }}:${{ github.event.inputs.version }}
            ghcr.io/${{ env.GITHUB_REPOSITORY }}:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          no-cache: true

      - name: Docker Scout stable
        id: docker-scout
        uses: docker/scout-action@v1.27.0
        with:
          command: environment,quickview,cves
          image: ${{ env.DKNR_NAMESPACE }}/${{ env.DKNR_IMAGE }}:${{ github.event.inputs.version }}
          environment: stable
          organization: ${{ env.DKNR_NAMESPACE }}
          write-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

